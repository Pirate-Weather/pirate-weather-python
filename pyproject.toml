[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pirateweather"
version = "1.1.0"
description = "The Pirate Weather API wrapper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pirate-Weather" }]
dependencies = [
    "requests==2.34.2",
    "pytz==2026.6",
    "aiohttp==3.14.5",
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Pirate-Weather/pirate-weather-python"
Documentation = "https://docs.pirateweather.net"
Issues = "https://github.com/Pirate-Weather/pirate-weather-python/issues"

[tool.setuptools.packages.find]
include = ["pirate_weather*"]
